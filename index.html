<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cynthia's World</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Carattere&display=swap" rel="stylesheet">
    
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            /* 纯色背景 */
            background-color: #F7EFFF; 
            font-family: sans-serif;
        }

        #app-container {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            gap: 2.5rem;
            /* 淡入动画，解决加载闪烁问题 */
            opacity: 0; 
            animation: fadeIn 0.8s ease-in forwards; 
            animation-delay: 0.1s; 
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* 标题完全保留 */
        h1 {
            font-family: 'Carattere', cursive; 
            color: #B630C1; 
            font-size: 7rem; 
            font-weight: 400; 
            margin: 0;
            line-height: 1.1;
            text-align: center;
            z-index: 1;
            text-shadow: 0 4px 15px rgba(182, 48, 193, 0.15);
            padding: 0 15px;
        }

        /* 你的 Liquid Glass 样式，100% 原封不动 */
        .liquid-glass-capsule {
            position: relative;
            display: flex;
            align-items: center;
            width: 440px; 
            max-width: 90%;
            padding: 8px 14px 8px 20px; 
            box-sizing: border-box;
            border-radius: 50px;
            z-index: 2;
            isolation: isolate;

            background:
                linear-gradient(135deg, rgba(230, 209, 249, 0.58) 0%, rgba(213, 161, 246, 0.28) 48%, rgba(255, 255, 255, 0.12) 100%),
                linear-gradient(90deg, rgba(175, 232, 239, 0.18), rgba(255, 226, 241, 0.14));
            backdrop-filter: blur(22px) saturate(1.85) brightness(0.9);
            -webkit-backdrop-filter: blur(22px) saturate(1.85) brightness(0.9);

            border: 1px solid rgba(255, 255, 255, 0.72);
            box-shadow: 
                0 20px 42px rgba(211, 185, 227, 0.28),
                2px 0 10px rgb(255, 255, 255),
                -2px 0 10px rgba(245, 212, 243, 0.253),
                inset 0 4px 12px rgba(255, 255, 255, 0.82),
                inset 0 -9px 18px rgba(209, 192, 222, 0.25);

            transition: transform 0.35s ease, box-shadow 0.35s ease;
        }

        .liquid-glass-capsule::before {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: inherit;
            pointer-events: none;
            z-index: 1;
            background:
                linear-gradient(180deg, rgba(231, 202, 240, 0.45), transparent 38%),
                radial-gradient(ellipse at 18% 50%, rgba(255, 255, 255, 0.683), transparent 42%),
                radial-gradient(ellipse at 84% 50%, #fee5f238, transparent 44%);
            box-shadow:
                inset 0 1px 2px rgba(255, 255, 255, 0.95),
                inset 0 -1px 8px rgba(200, 138, 235, 0.18);
            mix-blend-mode: screen;
        }

        .liquid-glass-capsule::after {
            content: "";
            position: absolute;
            left: 28px;
            right: 62px;
            top: 9px;
            height: 16px;
            border-radius: 999px;
            pointer-events: none;
            z-index: 1;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.78), rgba(234, 192, 237, 0.08));
            filter: blur(4px);
            opacity: 0.72;
        }

        .liquid-glass-capsule > canvas {
            border-radius: inherit;
            pointer-events: none;
        }

        .liquid-glass-capsule:focus-within {
            transform: scale(1.02);
            box-shadow: 
                0 28px 50px rgba(228, 206, 241, 0.34),
                3px 0 14px rgba(0, 229, 255, 0.44),
                -3px 0 14px rgba(255, 0, 128, 0.42),
                inset 0 5px 15px rgba(255, 255, 255, 0.9),
                inset 0 -10px 20px rgba(255, 255, 255, 0.3);
        }

        input {
            position: relative;
            flex-grow: 1;
            padding: 12px 10px;
            font-family: 'Carattere', cursive;
            font-size: 2.3rem; 
            border: none;
            background: transparent; 
            outline: none;
            color: #000000;
            text-align: left; 
            z-index: 3;
            min-width: 0; /* 防止手机端输入框撑破 */
        }

        input::placeholder {
            color: rgba(0, 0, 0, 0.6); 
            font-size: 2.3rem; 
            opacity: 1;
        }

        /* 按钮与箭头，100% 原封不动 */
        .submit-btn {
            position: relative;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: #B630C1; 
            border: 1px solid rgba(255, 255, 255, 0.55);
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 3;
            flex-shrink: 0; /* 防止手机端被挤压 */
            box-shadow:
                0 5px 14px rgba(106, 27, 154, 0.42),
                inset 0 2px 7px rgba(255, 255, 255, 0.62),
                inset 0 -5px 9px rgba(58, 0, 102, 0.2);
            overflow: visible;
        }

        .submit-btn::after {
            content: "\2794"; 
            color: white;
            font-size: 1.5rem; 
            font-weight: 900; 
            position: absolute;
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            line-height: 1; 
            display: block;
        }

        .submit-btn:hover {
            transform: scale(1.1) rotate(5deg);
            box-shadow:
                0 7px 18px rgba(213, 0, 249, 0.5),
                inset 0 2px 8px rgba(255, 255, 255, 0.72),
                inset 0 -5px 10px rgba(223, 187, 252, 0.24);
        }

        /* 手机端排版自适应完全保留 */
        @media (max-width: 768px) {
            #app-container { gap: 1.5rem; }
            h1 { font-size: 4.5rem; }
            .liquid-glass-capsule { padding: 6px 10px 6px 15px; }
            input { font-size: 1.8rem; padding: 8px 5px; }
            input::placeholder { font-size: 1.8rem; }
            .submit-btn { width: 38px; height: 38px; }
            .submit-btn::after { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

    <div id="app-container">
        <h1>Hiiiiiii Step Into Cynthia&rsquo;s World</h1>

        <div
            class="liquid-glass-capsule"
            data-config='{"blurAmount":0.02,"refraction":0.7,"chromAberration":0.09,"edgeHighlight":0.28,"specular":0.16,"fresnel":1,"distortion":0.025,"cornerRadius":50,"zRadius":40,"opacity":0.98,"saturation":0.42,"tintStrength":0.12,"brightness":-0.08,"shadowOpacity":0.5,"shadowSpread":10,"shadowOffsetY":8,"bevelMode":0}'
        >
            <input type="password" placeholder="Please enter the password..." aria-label="Password">
            <button class="submit-btn" type="button" aria-label="Submit password"></button>
        </div>

    </div>

    <script type="module">
        import { LiquidGlass } from 'https://cdn.jsdelivr.net/npm/@ybouane/liquidglass/dist/index.js';

        try {
            await LiquidGlass.init({
                root: document.querySelector('#app-container'),
                glassElements: document.querySelectorAll('.liquid-glass-capsule')
            });
        } catch (error) {
            console.warn('LiquidGlass shader failed to load; using CSS fallback.', error);
        }
    </script>
</body>
</html>
